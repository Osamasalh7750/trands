<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل دخول الإدارة | عطورات ترند</title>
  
  <!-- Favicon -->
  <link rel="icon" href="assets/favicon.png">

  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Custom Luxury Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

  <div class="login-card">
    
    <!-- Brand Header -->
    <div class="login-brand">
      <img src="assets/logo.png" alt="شعار عطورات ترند" class="login-brand-img">
      <h2 class="login-title gold-text">لوحة إدارة المتجر</h2>
      <p class="login-subtitle">متجر عطورات ترند (TRAND PERFUMES)</p>
    </div>

    <!-- Alert Box -->
    <div id="loginAlert" class="login-alert"></div>

    <!-- Login Form -->
    <form id="adminLoginForm" autocomplete="off">
      
      <!-- Email Field -->
      <div class="form-group">
        <label for="adminEmail">البريد الإلكتروني للإدارة:</label>
        <div class="input-with-icon">
          <i class="fas fa-envelope"></i>
          <input type="email" id="adminEmail" placeholder="أدخل البريد الإلكتروني..." required autocomplete="off" value="">
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="adminPassword">كلمة المرور:</label>
        <div class="input-with-icon">
          <i class="fas fa-lock"></i>
          <input type="password" id="adminPassword" placeholder="أدخل كلمة المرور..." required autocomplete="new-password" value="">
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.9rem;">
        <i class="fas fa-sign-in-alt"></i> <span id="loginBtnText">تسجيل الدخول</span>
      </button>

    </form>

    <!-- Return to Store -->
    <div class="login-footer-links">
      <a href="index.html"><i class="fas fa-arrow-right"></i> العودة إلى واجهة المتجر الرئيسية</a>
    </div>

  </div>

  <!-- Supabase Official JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // =========================================================================
    // 🔐 بيانات دخول مدير النظام (يمكنك تعديل البريد أو كلمة المرور هنا بسهولة)
    // =========================================================================
    const ADMIN_CREDENTIALS = {
      email: "omar@trand.com",
      password: "trand1234"
    };

    const SUPABASE_URL = "https://iceianuxbnhnpeupbbrz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_syiACLwvd6tIh7moWlWSdA_OXJ5o5KX";
    
    let supabaseClient = null;
    if (window.supabase) {
      try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      } catch (e) {
        console.warn("Supabase init error:", e);
      }
    }

    // Check if already authenticated
    window.addEventListener("DOMContentLoaded", async () => {
      // تفريغ الحقول تماماً لضمان عدم بقاء أي بيانات تلقائية من المتصفح
      setTimeout(() => {
        const eInput = document.getElementById("adminEmail");
        const pInput = document.getElementById("adminPassword");
        if (eInput) eInput.value = "";
        if (pInput) pInput.value = "";
      }, 50);

      // Check existing session in localStorage or Supabase
      const localAuth = localStorage.getItem("trand_admin_authenticated");
      if (localAuth === "true") {
        window.location.href = "admin.html";
        return;
      }

      if (supabaseClient) {
        try {
          const { data } = await supabaseClient.auth.getSession();
          if (data && data.session) {
            localStorage.setItem("trand_admin_authenticated", "true");
            window.location.href = "admin.html";
          }
        } catch (err) {
          // ignore
        }
      }
    });

    const form = document.getElementById("adminLoginForm");
    const alertBox = document.getElementById("loginAlert");
    const btn = document.getElementById("loginBtn");
    const btnText = document.getElementById("loginBtnText");

    function showAlert(msg, type = "danger") {
      alertBox.className = `login-alert show ${type}`;
      alertBox.innerHTML = `<i class="fas ${type === 'danger' ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${msg}`;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const email = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value.trim();

      if (!email || !password) {
        showAlert("يرجى إدخال البريد الإلكتروني وكلمة المرور");
        return;
      }

      btn.disabled = true;
      btnText.innerText = "جاري التحقق...";

      try {
        let authSuccess = false;

        // 1. التحقق المباشر من بيانات المدير المعتمدة لضمان نجاح العملية 100%
        if (email.toLowerCase() === ADMIN_CREDENTIALS.email.toLowerCase() && password === ADMIN_CREDENTIALS.password) {
          authSuccess = true;
        }

        // 2. التحقق السحابي عبر Supabase Auth (في حال تم استخدامه)
        if (!authSuccess && supabaseClient) {
          try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({
              email: email,
              password: password
            });

            if (!error && data && data.user) {
              authSuccess = true;
            }
          } catch (apiErr) {
            console.warn("Supabase auth API notice:", apiErr);
          }
        }

        if (authSuccess) {
          localStorage.setItem("trand_admin_authenticated", "true");
          localStorage.setItem("trand_admin_email", email);
          showAlert("تم تسجيل الدخول بنجاح! جاري الدخول للوحة الإدارة...", "success");
          setTimeout(() => {
            window.location.href = "admin.html";
          }, 500);
        } else {
          showAlert("البريد الإلكتروني أو كلمة المرور غير صحيحة. يرجى التأكد والمحاولة مجدداً.");
          btn.disabled = false;
          btnText.innerText = "تسجيل الدخول";
        }
      } catch (err) {
        console.error("Login exception:", err);
        if (email.toLowerCase() === ADMIN_CREDENTIALS.email.toLowerCase() && password === ADMIN_CREDENTIALS.password) {
          localStorage.setItem("trand_admin_authenticated", "true");
          localStorage.setItem("trand_admin_email", email);
          showAlert("تم تسجيل الدخول بنجاح! جاري الدخول للوحة الإدارة...", "success");
          setTimeout(() => {
            window.location.href = "admin.html";
          }, 500);
        } else {
          showAlert(err.message || "حدث خطأ أثناء الاتصال بقاعدة البيانات.");
          btn.disabled = false;
          btnText.innerText = "تسجيل الدخول";
        }
      }
    });
  </script>
</body>
</html>
